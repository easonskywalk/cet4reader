<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四级单词 · 背诵 / 测试 / 生词本</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232e6e4f'/%3E%3Ctext x='12' y='17' font-size='12' text-anchor='middle' fill='white' font-family='Georgia'%3E4%3C/text%3E%3C/svg%3E">
<style>
/* ===== 基础 ===== */
:root{
  --bg:#f4f3ee;
  --surface:#ffffff;
  --ink:#242b31;
  --ink-2:#5b6670;
  --ink-3:#8b949d;
  --line:#e2dfd5;
  --line-2:#efede5;
  --green:#2e6e4f;
  --green-deep:#24573f;
  --green-tint:#e7efe9;
  --red:#b5503f;
  --red-tint:#f8ece8;
  --amber:#a97922;
  --amber-tint:#f6f0e0;
  --radius:10px;
  --shadow:0 1px 2px rgba(36,43,49,.05),0 10px 28px rgba(36,43,49,.07);
  --serif:Georgia,"Times New Roman","Songti SC","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input{font-family:inherit;font-size:inherit}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== 顶栏 ===== */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1060px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;margin-right:6px}
.brand-icon{width:30px;height:30px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.brand-name{font-size:18px;font-weight:700;letter-spacing:.5px}
.brand-sub{font-size:12px;color:var(--ink-3);margin-top:1px}
.tabs{display:flex;gap:4px;background:var(--line-2);border-radius:10px;padding:3px}
.tab{position:relative;padding:7px 16px;border-radius:8px;font-weight:600;color:var(--ink-2);transition:background .15s,color .15s;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--surface);color:var(--green);box-shadow:0 1px 3px rgba(36,43,49,.1)}
.tab-badge{display:inline-flex;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-left:4px;vertical-align:1px}
.search{position:relative;flex:1;min-width:180px;max-width:320px;margin-left:auto}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{width:100%;padding:8px 32px 8px 34px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(46,110,79,.12)}
.search .clear{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:var(--line-2);color:var(--ink-2);font-size:13px;line-height:1;display:none;align-items:center;justify-content:center}
.search.has-val .clear{display:flex}

/* ===== 主区 ===== */
.main{max-width:1060px;margin:0 auto;padding:18px 20px 70px}
.unitbar{margin-bottom:14px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin;scrollbar-color:#d5d2c7 transparent}
.chips::-webkit-scrollbar{height:6px}
.chips::-webkit-scrollbar-thumb{background:#d5d2c7;border-radius:3px}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 13px 7px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink-2);font-weight:600;font-size:13px;transition:border-color .15s,color .15s,background .15s;min-width:0}
.chip small{font-size:10px;color:var(--ink-3);font-weight:500;line-height:1}
.chip:hover{border-color:var(--green);color:var(--green)}
.chip.active{background:var(--green);border-color:var(--green);color:#fff}
.chip.active small{color:rgba(255,255,255,.82)}
.chip .cp{width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:1px}
.chip .cp i{display:block;height:100%;border-radius:2px;background:currentColor;width:0;transition:width .3s}
.chip:not(.active) .cp{background:#ece9e0}
.chip:not(.active) .cp i{background:var(--green)}

/* 概要条 */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.summary-top{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.summary-title{font-weight:700;font-size:15px}
.summary-meta{color:var(--ink-3);font-size:12.5px}
.summary-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line-2)}
.summary-bar i{display:block;height:100%;transition:width .3s}
.summary-bar .s-m{background:var(--green)}
.summary-bar .s-u{background:var(--red)}
.summary-bar .s-n{background:#d8d5ca}
.summary-legend{display:flex;gap:16px;margin-top:8px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.legend-dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ld-m{background:var(--green)}.ld-u{background:var(--red)}.ld-n{background:#d8d5ca}

/* 词表行 */
.rowhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:600}
.fchip.active{background:var(--green);border-color:var(--green);color:#fff}
.rowhead .count{margin-left:auto;color:var(--ink-3);font-size:12.5px}
.wordlist{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.wrow{display:grid;grid-template-columns:185px 1fr auto auto auto;align-items:center;gap:10px 16px;padding:10px 16px;border-bottom:1px solid var(--line-2);transition:background .12s}
.wrow:last-child{border-bottom:none}
.wrow:hover{background:#faf9f5}
.wrow .w-word{font-family:var(--serif);font-size:16.5px;font-weight:700;color:var(--ink)}
.wrow .w-tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:8px;vertical-align:2px}
.wrow .w-meaning{color:var(--ink-2);font-size:14px}
.wrow .w-unit{font-size:11.5px;color:var(--ink-3);background:var(--line-2);border-radius:6px;padding:2px 8px;font-weight:600;white-space:nowrap}
.wrow .w-badge{font-size:11.5px;font-weight:600;white-space:nowrap}
.w-badge.m{color:var(--green)}
.w-badge.u{color:var(--red)}
.w-badge.g{color:var(--amber)}
.wrow .w-acts{display:flex;gap:6px;justify-content:flex-end}
.wrow .w-acts button{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:600;transition:all .13s;white-space:nowrap}
.wrow .w-acts button:hover{border-color:var(--green);color:var(--green)}
.wrow .w-acts button.on{background:var(--green);border-color:var(--green);color:#fff}
.wrow .w-acts button.u-on{background:var(--red);border-color:var(--red);color:#fff}
.wrow .w-acts svg{flex:none}

/* 空状态 */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:44px 20px;text-align:center;color:var(--ink-2)}
.empty .e-icon{color:var(--ink-3);margin-bottom:10px}
.empty .e-title{font-weight:700;font-size:16px;color:var(--ink);margin-bottom:4px}
.empty .e-sub{font-size:13.5px;color:var(--ink-3);margin-bottom:16px}
.empty .btn{margin:0 4px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;transition:all .13s;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-deep);border-color:var(--green-deep)}
.btn.ghost{color:var(--ink-2);background:transparent}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{flex:none}

/* ===== 背诵 ===== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.panel-title{font-weight:700;font-size:16px;margin-bottom:16px}
.opt-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.opt-item{flex:1;min-width:150px;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--surface);text-align:left;transition:all .13s}
.opt-item:hover{border-color:var(--green);background:var(--green-tint)}
.opt-item .o-label{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:3px;font-weight:600}
.opt-item .o-val{font-weight:600;font-size:14.5px}
.opt-item.sel{border-color:var(--green);background:var(--green-tint)}
.opt-item.sel .o-val{color:var(--green)}
.switch-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;cursor:pointer;user-select:none}
.switch{position:relative;width:42px;height:24px;border-radius:12px;background:var(--line);transition:background .18s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .18s}
.switch.on{background:var(--green)}
.switch.on::after{left:21px}
.switch-label{font-size:13.5px;color:var(--ink-2)}
.session-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.session-top .sp-label{font-size:13px;color:var(--ink-2);font-weight:600}
.session-top .sp-label b{color:var(--ink)}
.track{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;flex:1;margin:0 14px}
.track i{display:block;height:100%;background:var(--green);width:0;transition:width .25s;border-radius:3px}
#memExit,#testExit{color:var(--ink-3);font-size:13px;padding:6px 10px;border-radius:8px}
#memExit:hover,#testExit:hover{color:var(--red);background:var(--red-tint)}
.flash-wrap{max-width:560px;margin:10px auto 0;position:relative}
.flash-spk{position:absolute;top:14px;right:14px;z-index:5;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);border:1px solid var(--line);color:var(--green-deep);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(36,43,49,.12);transition:all .13s}
.flash-spk:hover{background:#fff;transform:scale(1.06)}
.flash-spk:active{transform:scale(.94)}
.spk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;color:var(--ink-3);vertical-align:-3px;margin-left:6px;flex:none;transition:all .12s}
.spk:hover{color:var(--green);background:var(--green-tint)}
.spk:active{transform:scale(.9)}
.wrow .w-word .spk{vertical-align:-4px}
.q-word{display:flex;align-items:center;justify-content:center;gap:4px}
.q-word .spk{width:34px;height:34px;color:var(--green-deep)}
.flash{width:100%;aspect-ratio:16/10;background:transparent;padding:0;perspective:1200px}
.flash-inner{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.25,.75,.25,1)}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center}
.face-back{transform:rotateY(180deg);border-color:var(--green)}
.face .f-label{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:1px;margin-bottom:12px}
.face .f-big{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--ink);line-height:1.3;word-break:break-word;max-width:100%}
.flash.flipped .face-front .f-big{font-size:34px}
.face .f-en{font-family:var(--serif);font-size:38px;font-weight:700;color:var(--green-deep);line-height:1.3;word-break:break-word;max-width:100%}
.face .f-zh{font-size:20px;color:var(--ink);margin-top:10px;line-height:1.5;max-width:100%}
.face .f-unit{position:absolute;top:14px;left:16px;font-size:11px;color:var(--ink-3);background:var(--line-2);padding:2px 8px;border-radius:6px;font-weight:600}
.flash-hint{text-align:center;color:var(--ink-3);font-size:12px;margin-top:14px}
.flash-actions{display:flex;gap:12px;justify-content:center;margin-top:18px}
.fa{flex:1;max-width:170px;padding:13px 10px;border-radius:12px;border:1.5px solid;font-weight:700;font-size:15px;transition:all .13s;background:var(--surface)}
.fa:hover{transform:translateY(-1px)}
.fa-know{color:var(--green);border-color:var(--green)}
.fa-know:hover{background:var(--green);color:#fff}
.fa-fuzzy{color:var(--amber);border-color:var(--amber)}
.fa-fuzzy:hover{background:var(--amber);color:#fff}
.fa-not{color:var(--red);border-color:var(--red)}
.fa-not:hover{background:var(--red);color:#fff}
.result-box{text-align:center;padding:14px 0 4px}
.result-box .r-big{font-family:var(--serif);font-size:64px;font-weight:700;color:var(--green-deep);line-height:1.1}
.result-box .r-sub{color:var(--ink-2);margin-top:4px;font-size:14.5px}
.result-box .r-stats{display:flex;gap:26px;justify-content:center;margin:18px 0 6px;flex-wrap:wrap}
.r-stat{text-align:center}
.r-stat b{display:block;font-size:22px;font-weight:700}
.r-stat span{font-size:12px;color:var(--ink-3)}
.r-stat.ok b{color:var(--green)}.r-stat.no b{color:var(--red)}.r-stat.time b{color:var(--ink-2);font-size:18px}
.rbar{max-width:360px;height:10px;border-radius:5px;background:var(--line-2);overflow:hidden;margin:14px auto 0}
.rbar i{display:block;height:100%;background:var(--green);width:0;transition:width .4s}
.result-actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.result-list{text-align:left;margin-top:24px;border-top:1px solid var(--line-2);padding-top:16px}
.result-list h4{font-size:14px;margin-bottom:10px;color:var(--ink-2)}
.rl-row{display:flex;align-items:baseline;gap:12px;padding:6px 4px;border-bottom:1px dashed var(--line-2);font-size:14px;flex-wrap:wrap}
.rl-row .rl-w{font-family:var(--serif);font-weight:700;color:var(--red);min-width:110px}
.rl-row .rl-m{color:var(--ink-2);flex:1;min-width:120px}
.rl-row .rl-u{font-size:11px;color:var(--ink-3)}

/* ===== 测试 ===== */
.test-q{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 26px;text-align:center;margin-top:8px}
.test-q .q-label{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:1px;margin-bottom:10px}
.test-q .q-main{font-size:26px;color:var(--ink);font-weight:700;line-height:1.5;word-break:break-word}
.test-q .q-main.en{font-family:var(--serif);font-size:34px;color:var(--green-deep)}
.test-input{display:flex;gap:10px;max-width:520px;margin:22px auto 0}
.test-input input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:17px;font-family:var(--serif);text-align:center}
.test-input input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(46,110,79,.12)}
.test-input input.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(181,80,63,.12)}
.test-input input.ok{border-color:var(--green);box-shadow:0 0 0 3px rgba(46,110,79,.12)}
.dict-audio{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px auto 0}
.dict-audio .btn{font-size:14px}
.dict-tip{font-size:12px;color:var(--ink-3)}
.opts{max-width:560px;margin:20px auto 0;display:flex;flex-direction:column;gap:10px}
.opt{border:1.5px solid var(--line);border-radius:11px;background:var(--surface);padding:13px 16px;font-size:15.5px;color:var(--ink);text-align:left;transition:all .13s;display:flex;align-items:center;gap:10px}
.opt .o-key{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);color:var(--ink-3);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.opt:hover:not(:disabled){border-color:var(--green);background:var(--green-tint)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--green);background:var(--green-tint)}
.opt.correct .o-key{border-color:var(--green);color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-tint)}
.opt.wrong .o-key{border-color:var(--red);color:var(--red)}
.opt .o-tag{margin-left:auto;font-size:12px;font-weight:700}
.opt.correct .o-tag{color:var(--green)}
.opt.wrong .o-tag{color:var(--red)}
.feedback{margin:14px auto 0;max-width:560px;text-align:center;font-size:14px}
.feedback .fb-ans{font-size:14px;color:var(--ink-2)}
.feedback .fb-ans b{font-family:var(--serif);font-size:17px;color:var(--green-deep)}
.fb-ok{color:var(--green);font-weight:700}
.fb-no{color:var(--red);font-weight:700}
.next-row{margin-top:14px}

/* ===== 生词本 ===== */
.unfam-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.unfam-head .u-count{font-size:16px}
.unfam-head .u-count b{font-size:26px;color:var(--red);font-family:var(--serif)}
.unfam-head .u-count span{color:var(--ink-3);font-size:13px}
.unfam-actions{display:flex;gap:8px}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.chart-title{font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:12px}
.cbar-row{display:grid;grid-template-columns:54px 1fr 46px;align-items:center;gap:10px;padding:4px 0}
.cbar-row .cb-l{font-size:12px;color:var(--ink-2);font-weight:600;text-align:right}
.cbar-row .cb-track{height:11px;background:var(--line-2);border-radius:6px;overflow:hidden}
.cbar-row .cb-fill{height:100%;background:var(--red);border-radius:6px;width:0;transition:width .4s}
.cbar-row .cb-n{font-size:12px;color:var(--ink-3);text-align:right}
.ugroup{margin-bottom:18px}
.ugroup h3{font-size:13px;color:var(--ink-3);font-weight:700;margin-bottom:8px;display:flex;align-items:baseline;gap:8px}
.ugroup h3 em{font-style:normal;font-weight:600}

/* ===== Toast / 页脚 ===== */
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{max-width:1060px;margin:0 auto;padding:0 20px 34px;color:var(--ink-3);font-size:12px;text-align:center}

/* ===== 响应式 ===== */
@media (max-width:820px){
  .top-in{gap:10px;padding:10px 14px}
  .tabs{order:3;width:100%;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1;text-align:center;padding:8px 10px}
  .search{max-width:none;min-width:0;order:2;margin-left:0}
  .brand-sub{display:none}
  .wrow{grid-template-columns:1fr auto;gap:6px 10px}
  .wrow .w-word{grid-column:1;grid-row:1}
  .wrow .w-unit{grid-column:2;grid-row:1;justify-self:end}

<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
      <span>
        <span class="brand-name">四级单词</span><br>
        <span class="brand-sub" id="brandSub"></span>
      </span>
    </div>
    <nav class="tabs" id="tabs" aria-label="功能导航">
      <button class="tab active" data-tab="browse">单词表</button>
      <button class="tab" data-tab="memorize">背诵</button>
      <button class="tab" data-tab="test">测试</button>
      <button class="tab" data-tab="unfam">生词本<span class="tab-badge hidden" id="unfamBadge">0</span></button>
      <button class="tab" data-tab="grad">毕业本<span class="tab-badge hidden" id="gradBadge" style="background:var(--amber)">0</span></button>
    </nav>
    <div class="search" id="searchBox">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input id="searchInput" type="text" placeholder="搜索单词或释义" autocomplete="off" aria-label="搜索单词或释义">
      <button class="clear" id="searchClear" aria-label="清除搜索"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
  </div>
</header>

<main class="main">
  <section class="unitbar" aria-label="单元选择">
    <div class="chips" id="unitChips"></div>
  </section>

  <!-- ===== 视图：单词表 ===== -->
  <section class="view" id="view-browse">
    <div class="summary" id="browseSummary"></div>
    <div class="rowhead">
      <div class="fchips" id="browseFilters">
        <button class="fchip active" data-f="all">全部</button>
        <button class="fchip" data-f="tested">已测</button>
        <button class="fchip" data-f="untested">未测</button>
        <button class="fchip" data-f="mastered">已掌握</button>
        <button class="fchip" data-f="unfam">生词</button>
        <button class="fchip" data-f="none">未标记</button>
      </div>
      <span class="count" id="browseCount"></span>
    </div>
    <div class="wordlist" id="wordList"></div>
    <div class="empty hidden" id="browseEmpty"></div>
  </section>

  <!-- ===== 视图：背诵 ===== -->
  <section class="view hidden" id="view-memorize">
    <div id="memSetup"></div>
    <div id="memSession" class="hidden">
      <div class="session-top">
        <div style="display:flex;align-items:center;flex:1;min-width:0">
          <span class="sp-label" id="memLabel"></span>
          <div class="track"><i id="memTrack"></i></div>
        </div>
        <button id="memExit">结束背诵</button>
      </div>
      <div class="flash-wrap">
        <button class="flash" id="flashCard" aria-label="点击翻面查看答案">
          <span class="flash-inner">
            <span class="face face-front">
              <span class="f-label" id="flashFrontLabel"></span>
              <span class="f-big" id="flashFront"></span>
            </span>
            <span class="face face-back">
              <span class="f-unit" id="flashUnit"></span>
              <span class="f-en" id="flashWord"></span>
              <span class="f-zh" id="flashMeaning"></span>
            </span>
          </span>
        </button>
        <button class="flash-spk" id="flashSpeak" title="朗读发音" aria-label="朗读发音"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
      </div>
      <div class="flash-actions">
        <button class="fa fa-know" id="faKnow">认识</button>
        <button class="fa fa-fuzzy" id="faFuzzy">模糊</button>
        <button class="fa fa-not" id="faNot">不认识</button>
      </div>
      <div class="flash-hint" id="flashHint"></div>
    </div>
    <div id="memResult" class="hidden"></div>
  </section>

  <!-- ===== 视图：测试 ===== -->
  <section class="view hidden" id="view-test">
    <div id="testSetup"></div>
    <div id="testSession" class="hidden">
      <div class="session-top">
        <div style="display:flex;align-items:center;flex:1;min-width:0">
          <span class="sp-label" id="testLabel"></span>
          <div class="track"><i id="testTrack"></i></div>
        </div>
        <button id="testExit">结束测试</button>
      </div>
      <div class="test-q" id="testQ"></div>
      <div class="feedback hidden" id="testFeedback"></div>
    </div>
    <div id="testResult" class="hidden"></div>
  </section>

  <!-- ===== 视图：生词本 ===== -->
  <section class="view hidden" id="view-unfam">
    <div class="unfam-head">
      <div class="u-count" id="unfamCount"></div>
      <div class="unfam-actions">
        <button class="btn primary" id="unfamReview"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72L19 12 8 5.14z"/></svg>复习生词</button>
        <button class="btn ghost danger" id="unfamClear">清空</button>
      </div>
    </div>
    <div id="unfamBody"></div>
  </section>

  <!-- ===== 视图：毕业错题本 ===== -->
  <section class="view hidden" id="view-grad">
    <div class="unfam-head">
      <div class="u-count" id="gradCount"></div>
      <div class="unfam-actions">
        <button class="btn primary" id="gradTest"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72L19 12 8 5.14z"/></svg>测试毕业词</button>
        <button class="btn ghost danger" id="gradClear">清空</button>
      </div>
    </div>
    <div id="gradBody"></div>
  </section>
</main>

var UNIT_N = 35;
var total = WORDS.length;
var byUnit = [];
for (var u = 1; u <= UNIT_N; u++) byUnit.push([]);
WORDS.forEach(function (w, i) { byUnit[w[0] - 1].push(i); });

var state = { tab: 'browse', unit: 0, filter: 'all', search: '' };

var mastered = loadSet('cet4.mastered.v1'); // 已掌握

var testedSet = loadSet('cet4.tested.v1');  // 已测试的词

function loadSet(k) { try { var v = JSON.parse(localStorage.getItem(k)); return v && Array.isArray(v) ? new Set(v) : new Set(); } catch (e) { return new Set(); } }
function loadArr(k) { try { var v = JSON.parse(localStorage.getItem(k)); return v && Array.isArray(v) ? v : []; } catch (e) { return []; } }
function save() {
  try {
    localStorage.setItem('cet4.unfam.v1', JSON.stringify(Array.from(unfam)));
    localStorage.setItem('cet4.mastered.v1', JSON.stringify(Array.from(mastered)));
    localStorage.setItem('cet4.wrong.v1', JSON.stringify(Array.from(wrongSet)));
    localStorage.setItem('cet4.tested.v1', JSON.stringify(Array.from(testedSet)));
    localStorage.setItem('cet4.grad.v1', JSON.stringify(Array.from(grad)));
    localStorage.setItem('cet4.testlog.v1', JSON.stringify(testLog.slice(-8)));
  } catch (e) {}
}
function keyOf(i) { return WORDS[i][0] + ':' + WORDS[i][1].toLowerCase(); }

function $(s) { return document.querySelector(s); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function shuffleArr(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

var toastTimer;
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1500); }

/* ===== 朗读发音 ===== */
var cachedVoice = null;
function pickVoice() {
  if (!window.speechSynthesis) return;
  var vs = speechSynthesis.getVoices();
  cachedVoice = vs.filter(function (v) { return /^en[-_]US/i.test(v.lang); })[0] ||
                vs.filter(function (v) { return /^en/i.test(v.lang); })[0] || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text) {
  if (!window.speechSynthesis) { toast('当前浏览器不支持朗读'); return; }
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(String(text));
  if (cachedVoice) u.voice = cachedVoice;
  u.lang = cachedVoice ? cachedVoice.lang : 'en-US';
  u.rate = 0.9; u.pitch = 1;
  speechSynthesis.speak(u);
}

/* ===== 单元选择 ===== */
function renderUnitChips() {
  var html = '<button class="chip' + (state.unit === 0 ? ' active' : '') + '" data-u="0"><span>全部</span><small>' + total + ' 词</small></button>';
  for (var u = 1; u <= UNIT_N; u++) {
    var idx = byUnit[u - 1];
    var m = 0, un = 0, t = 0;
    for (var k = 0; k < idx.length; k++) { var kk = keyOf(idx[k]); if (mastered.has(kk)) m++; if (unfam.has(kk)) un++; if (testedSet.has(kk)) t++; }
    var pct = idx.length ? Math.round(m / idx.length * 100) : 0;
    var act = state.unit === u ? ' active' : '';
    html += '<button class="chip' + act + '" data-u="' + u + '" title="WL ' + u + ' · ' + idx.length + ' 词 · 已测 ' + t + ' · 已掌握 ' + m + ' · 生词 ' + un + '"><span>WL ' + u + '</span><small>' + m + '/' + idx.length + '</small><span class="cp"><i style="width:' + pct + '%"></i></span></button>';
  }
  $('#unitChips').innerHTML = html;
}
function updateBadge() {
  var b = $('#unfamBadge');
  b.textContent = unfam.size;
  b.classList.toggle('hidden', unfam.size === 0);
  var g = $('#gradBadge');
  if (g) { g.textContent = grad.size; g.classList.toggle('hidden', grad.size === 0); }
}

/* ===== 导航 ===== */
function switchTab(t) {
  state.tab = t;
  try { history.replaceState(null, '', '#' + t); } catch (e) {}
  document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === t); });
  document.querySelectorAll('.view').forEach(function (v) { v.classList.add('hidden'); });
  $('#view-' + t).classList.remove('hidden');
  if (t === 'memorize') { endMemSession(true); renderMemSetup(); }
  else if (t === 'test') { endTestSession(true); renderTestSetup(); }
  else if (t === 'browse') renderBrowse();
  else if (t === 'grad') renderGrad();
  else renderUnfam();
}
function renderCurrentView() {
  if (state.tab === 'browse') renderBrowse();
  else if (state.tab === 'memorize') renderMemSetup();
  else if (state.tab === 'test') renderTestSetup();
  else if (state.tab === 'grad') renderGrad();
  else renderUnfam();
}

function scopeIndices() {
  var q = state.search.trim().toLowerCase();
  var unit = state.unit, out = [];
  for (var i = 0; i < total; i++) {
    var w = WORDS[i];
    if (!q && unit > 0 && w[0] !== unit) continue;
    if (q && w[1].toLowerCase().indexOf(q) < 0 && w[2].indexOf(q) < 0) continue;
    out.push(i);
  }
  return out;
}
function filteredIndices() {
  var f = state.filter, list = scopeIndices(), out = [];
  for (var i = 0; i < list.length; i++) {
    var idx = list[i], k = keyOf(idx);
    var isU = unfam.has(k), isM = mastered.has(k), isT = testedSet.has(k);
    if (f === 'mastered' && !isM) continue;
    if (f === 'unfam' && !isU) continue;
    if (f === 'tested' && !isT) continue;
    if (f === 'untested' && isT) continue;
    if (f === 'none' && (isU || isM)) continue;
    out.push(idx);
  }
  return out;
}
function renderBrowse() {
  var sc = scopeIndices(), m = 0, un = 0, t = 0;
  for (var i = 0; i < sc.length; i++) { var k = keyOf(sc[i]); if (mastered.has(k)) m++; if (unfam.has(k)) un++; if (testedSet.has(k)) t++; }
  var n = sc.length - m - un;
  var pM = sc.length ? m / sc.length * 100 : 0, pU = sc.length ? un / sc.length * 100 : 0, pN = sc.length ? n / sc.length * 100 : 0;
  $('#browseSummary').innerHTML =
    '<div class="summary-top"><span class="summary-title">' + (state.search.trim() ? '搜索结果' : (state.unit ? 'Word List ' + state.unit : '全部单词')) + '</span>' +
    '<span class="summary-meta">共 ' + sc.length + ' 词 · 已测 ' + t + ' · 已掌握 ' + m + ' · 生词 ' + un + '</span></div>' +
    '<div class="summary-bar"><i class="s-m" style="width:' + pM + '%"></i><i class="s-u" style="width:' + pU + '%"></i><i class="s-n" style="width:' + pN + '%"></i></div>' +
    '<div class="summary-legend"><span><span class="legend-dot ld-m"></span>已掌握 ' + m + '</span><span><span class="legend-dot ld-u"></span>生词 ' + un + '</span><span><span class="legend-dot ld-n"></span>未标记 ' + n + '</span></div>';
  document.querySelectorAll('#browseFilters .fchip').forEach(function (b) { b.classList.toggle('active', b.dataset.f === state.filter); });
  var list = filteredIndices();
  $('#browseCount').textContent = '显示 ' + list.length + ' / ' + sc.length + ' 词';
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var idx = list[i], w = WORDS[idx], k = keyOf(idx);
    var isM = mastered.has(k), isU = unfam.has(k), isT = testedSet.has(k);
    var badge = isM ? '<span class="w-badge m">已掌握</span>' : (isU ? '<span class="w-badge u">生词</span>' : '');
    var unitTag = (state.unit === 0 || state.search.trim()) ? '<span class="w-unit">WL ' + w[0] + '</span>' : '';
    html += '<div class="wrow" data-i="' + idx + '">' +
      '<span class="w-word">' + (isT ? '<i class="w-tdot" title="已测过"></i>' : '') + esc(w[1]) + '<button class="spk" data-t="' + esc(w[1]) + '" title="朗读发音"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button></span>' +
      '<span class="w-meaning">' + esc(w[2]) + '</span>' +
      unitTag + badge +
      '<span class="w-acts">' +
      '<button class="' + (isM ? 'on' : '') + '" data-act="m" title="标记为已掌握"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>掌握</button>' +

      '</span></div>';
  }
  $('#wordList').innerHTML = html;

  if (!list.length) {
    $('#browseEmpty').innerHTML = '<div class="e-title">没有匹配的单词</div><div class="e-sub">试试切换单元或清除搜索关键词</div>' +

    if (!units[u]) continue;
    var cnt = units[u].length, tot = byUnit[u - 1].length;
    chart += '<div class="cbar-row"><span class="cb-l">WL ' + u + '</span><span class="cb-track"><span class="cb-fill" style="width:' + Math.round(cnt / tot * 100) + '%"></span></span><span class="cb-n">' + cnt + '</span></div>';
  }
  chart += '</div>';
  var list = '';
  for (var u = 1; u <= UNIT_N; u++) {
    if (!units[u]) continue;
    list += '<div class="ugroup"><h3>Word List ' + u + ' <em>' + units[u].length + ' 词</em></h3>';
    list += units[u].map(function (i) {
      var w = WORDS[i];
      return '<div class="wrow" data-i="' + i + '"><span class="w-word">' + esc(w[1]) + '<button class="spk" data-t="' + esc(w[1]) + '" title="朗读发音"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button></span><span class="w-meaning">' + esc(w[2]) + '</span><span class="w-badge u">生词</span>' +
        '<span class="w-acts"><button data-act="m" title="标记为已掌握"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>掌握</button>' +
        '<button data-act="r" title="从生词本移除"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>移除</button></span></div>';
    }).join('');
    list += '</div>';
  }
  body.innerHTML = chart + list;
}
var clearArmed = false, clearTimer;
function armClear() {
  var btn = $('#unfamClear');
  if (!clearArmed) {
    clearArmed = true; btn.textContent = '确认清空？'; btn.classList.add('danger');
    clearTimer = setTimeout(function () { clearArmed = false; btn.textContent = '清空'; btn.classList.remove('danger'); }, 3000);
  } else {
    clearTimeout(clearTimer); clearArmed = false;
    unfam.clear(); save(); updateBadge(); renderUnfam();
    toast('已清空生词本');
    btn.textContent = '清空'; btn.classList.remove('danger');
  }
}
var wrongClearArmed = false, wrongClearTimer;
function armWrongClear() {
  var btn = $('#wrongClear'); if (!btn) return;
  if (!wrongClearArmed) {
    wrongClearArmed = true; btn.textContent = '确认清空？'; btn.classList.add('danger');
    wrongClearTimer = setTimeout(function () { wrongClearArmed = false; btn.textContent = '清空错题'; btn.classList.remove('danger'); }, 3000);
  } else {
    clearTimeout(wrongClearTimer); wrongClearArmed = false;
    wrongSet.clear(); save(); renderTestSetup();
    toast('已清空错题本');
  }
}

/* ===== 视图：毕业错题本 ===== */
function renderGrad() {
  var n = grad.size;
  var units = {};
  for (var i = 0; i < total; i++) { var k = keyOf(i); if (grad.has(k)) { var u = WORDS[i][0]; units[u] = units[u] || []; units[u].push(i); } }
  var unitCount = Object.keys(units).length;
  $('#gradCount').innerHTML = '<b>' + n + '</b> 个毕业错题' + (n ? '<span> · 曾经答错、现已答对 · 来自 ' + unitCount + ' 个单元</span>' : '');
  var body = $('#gradBody');
  if (!n) {
    body.innerHTML = '<div class="empty"><div class="e-title">毕业错题本还是空的</div><div class="e-sub">错题重测中答对的单词会自动收录到这里，方便你巩固已经掌握的词</div>' +
      '<button class="btn primary" id="gradGoWrong">去做错题重测</button></div>';
    var gw = $('#gradGoWrong'); if (gw) gw.onclick = function () { switchTab('test'); };
    return;
  }
  var list = '';
  for (var u = 1; u <= UNIT_N; u++) {
    if (!units[u]) continue;
    list += '<div class="ugroup"><h3>Word List ' + u + ' <em>' + units[u].length + ' 词</em></h3>';
    list += units[u].map(function (i) {
      var w = WORDS[i];
      return '<div class="wrow" data-i="' + i + '"><span class="w-word">' + esc(w[1]) + '<button class="spk" data-t="' + esc(w[1]) + '" title="朗读发音"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>' + '</span><span class="w-meaning">' + esc(w[2]) + '</span><span class="w-badge g">毕业</span>' +
        '<span class="w-acts"><button data-act="r" title="从毕业本移除"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>移除</button></span></div>';
    }).join('');
    list += '</div>';
  }
  body.innerHTML = list;
}
var gradClearArmed = false, gradClearTimer;
function armGradClear() {
  var btn = $('#gradClear'); if (!btn) return;
  if (!gradClearArmed) {
    gradClearArmed = true; btn.textContent = '确认清空？'; btn.classList.add('danger');
    gradClearTimer = setTimeout(function () { gradClearArmed = false; btn.textContent = '清空'; btn.classList.remove('danger'); }, 3000);
  } else {
    clearTimeout(gradClearTimer); gradClearArmed = false;
    grad.clear(); save(); updateBadge(); renderGrad();
    toast('已清空毕业本');
    btn.textContent = '清空'; btn.classList.remove('danger');
  }
}

/* ===== 事件绑定 ===== */
$('#tabs').addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (b) switchTab(b.dataset.tab); });
$('#unitChips').addEventListener('click', function (e) {
  var b = e.target.closest('.chip'); if (!b) return;
  state.unit = +b.dataset.u;
  if (state.search.trim()) { state.search = ''; searchInput.value = ''; searchBox.classList.remove('has-val'); }
  renderUnitChips(); renderCurrentView();
});
$('#browseFilters').addEventListener('click', function (e) {
  var b = e.target.closest('.fchip'); if (!b) return;
  state.filter = b.dataset.f; renderBrowse();
});
$('#wordList').addEventListener('click', function (e) {
  if (e.target.closest('.spk')) return;
  var b = e.target.closest('button'); if (!b) return;
  var row = b.closest('.wrow'); if (!row) return;
  var i = +row.dataset.i, k = keyOf(i);
  if (b.dataset.act === 'm') {
    if (mastered.has(k)) { mastered.delete(k); } else { mastered.add(k); unfam.delete(k); }
  } else {
    if (unfam.has(k)) { unfam.delete(k); } else { unfam.add(k); mastered.delete(k); }
  }
  save(); updateBadge(); renderBrowse();
});
var searchInput = $('#searchInput'), searchBox = $('#searchBox');
searchInput.addEventListener('input', function () {
  state.search = searchInput.value;
  searchBox.classList.toggle('has-val', !!state.search.trim());
  if (state.tab !== 'browse') switchTab('browse'); else renderBrowse();
});
$('#searchClear').onclick = function () { searchInput.value = ''; state.search = ''; searchBox.classList.remove('has-val'); renderBrowse(); };

$('#flashCard').addEventListener('click', function () { flipCard(); });
$('#faKnow').addEventListener('click', function () { answerMem('know'); });
$('#faFuzzy').addEventListener('click', function () { answerMem('fuzzy'); });
$('#faNot').addEventListener('click', function () { answerMem('not'); });
$('#memExit').addEventListener('click', function () { endMemSession(false); renderMemSetup(); });

$('#testExit').addEventListener('click', function () { endTestSession(false); renderTestSetup(); });
$('#testQ').addEventListener('click', function (e) {
  var b = e.target.closest('.opt'); if (!b) return;
  pickOpt(+b.dataset.k);
});
$('#unfamReview').addEventListener('click', function () { mem.scope = 'unfam'; mem.shuffle = true; switchTab('memorize'); startMemorize(); });
$('#unfamClear').addEventListener('click', armClear);
$('#unfamBody').addEventListener('click', function (e) {
  if (e.target.closest('.spk')) return;
  var b = e.target.closest('button'); if (!b) return;
  var row = b.closest('.wrow'); if (!row) return;
  var i = +row.dataset.i, k = keyOf(i);
  if (b.dataset.act === 'm') { mastered.add(k); unfam.delete(k); toast('已标记为掌握'); }
  else { unfam.delete(k); toast('已从生词本移除'); }
  save(); updateBadge(); renderUnfam();
});
$('#gradTest').addEventListener('click', function () {
  if (!grad.size) { toast('毕业本是空的'); return; }
  test.scope = 'grad'; test.count = 0;
  switchTab('test'); startTest();
});
$('#gradClear').addEventListener('click', armGradClear);
$('#gradBody').addEventListener('click', function (e) {
  if (e.target.closest('.spk')) return;
  var b = e.target.closest('button'); if (!b) return;
  var row = b.closest('.wrow'); if (!row) return;
  grad.delete(keyOf(+row.dataset.i));
  save(); updateBadge(); renderGrad();
  toast('已从毕业本移除');
});

/* ===== 朗读：全局委托 ===== */
$('#flashSpeak').addEventListener('click', function () { if (mem.started) speak(WORDS[mem.queue[mem.pos]][1]); });
document.addEventListener('click', function (e) {
  var sp = e.target.closest('.spk');
  if (sp) { if (sp.dataset.t) speak(sp.dataset.t); return; }
  var ww = e.target.closest('.w-word');
  if (ww) { var row = ww.closest('.wrow'); if (row && row.hasAttribute('data-i')) speak(WORDS[+row.dataset.i][1]); }
});

/* ===== 键盘快捷键 ===== */
document.addEventListener('keydown', function (e) {
  var tag = (e.target.tagName || '').toLowerCase();
  var memOpen = state.tab === 'memorize' && !memDom.session.classList.contains('hidden') && mem.started;
  var testOpen = state.tab === 'test' && !testDom.session.classList.contains('hidden');
  if (memOpen) {
    if (e.key === ' ') { e.preventDefault(); flipCard(); }
    else if (e.key === '4') { speak(WORDS[mem.queue[mem.pos]][1]); }
    else if (e.key === '1') answerMem('know');
    else if (e.key === '2') answerMem('fuzzy');
    else if (e.key === '3') answerMem('not');
    return;
  }
  if (!testOpen) return;
  if (e.key === 'Enter') {
    if (tag === 'input') { if (test.answered) nextQ(); else submitHan(); }
    else if (test.answered) nextQ();
    return;
  }
  if (e.key === '0') { speak(WORDS[test.queue[test.pos]][1]); return; }
  if (e.key === ' ') { if (test.answered) { e.preventDefault(); nextQ(); } return; }
  if (tag === 'input') return;
  if (e.key >= '1' && e.key <= '4') pickOpt(+e.key - 1);
});

/* ===== 初始化 ===== */
$('#brandSub').textContent = UNIT_N + ' 单元 · ' + total + ' 词';
renderUnitChips();
var initHash = (location.hash || '').replace('#', '');
if (['browse', 'memorize', 'test', 'unfam', 'grad'].indexOf(initHash) >= 0) switchTab(initHash);
else renderBrowse();
updateBadge();
</script>
</body>
</html>
